  if (installEvt) h.classList.add("can-install");
  h.innerHTML = `<div class="hbox">
    <div class="hcat"><img src="assets/whisky_talk.png" alt=""><div class="hsay">${esc(line("home.ask"))}</div></div>
    <div class="hmain">
      <h2>Перед тем как начать</h2>
      <p class="hlead">Так игра откроется на весь экран, а прогресс точно не потеряется.</p>
      <ol>${homeSteps()}</ol>
      <div class="hbtns"><button class="btn main hinstall" id="hinst">Установить одним нажатием</button><button class="btn ${installEvt ? "" : "main"}" id="hdone">Готово, добавил</button></div>
      <p class="hnote">Если ссылка открылась внутри Telegram или другого мессенджера, сначала открой её в ${IOS_DEV ? "Safari" : "Chrome"}.</p>
      <button class="hskip" id="hskip">Играть прямо в браузере</button>
    </div></div>`;
  ROOT.classList.add("homeask");
  h.querySelector("#hdone").onclick = () => { SFX.click(); homeDone(); };
  h.querySelector("#hskip").onclick = homeSkip;
  h.querySelector("#hinst").onclick = async () => {
    if (!installEvt) return;
    try { installEvt.prompt(); const r = await installEvt.userChoice; if (r && r.outcome === "accepted") homeDone(); } catch (e) {}
    installEvt = null; h.classList.remove("can-install");
  };
}
function homeDone() {
  const h = document.getElementById("home"); if (!h) return;
  h.innerHTML = `<div class="hbox">
    <div class="hcat"><img src="assets/whisky_talk.png" alt=""><div class="hsay">${esc(line("home.done"))}</div></div>
    <div class="hmain">
      <h2>Почти готово</h2>
      <p class="hlead">Найди Виски на экране «Домой» и открой игру оттуда. Эту вкладку можно закрыть.</p>
      <div class="hbtns"><button class="btn alt" id="hback">◂ Ещё не добавил</button></div>
      <button class="hskip" id="hskip">Играть прямо в браузере</button>
    </div></div>`;
  h.querySelector("#hback").onclick = () => { SFX.click(); showHome(); };
  h.querySelector("#hskip").onclick = homeSkip;
}
function homeSkip() {
  SFX.click(); ROOT.classList.remove("homeask");
  if (P.intro || introRunning) return;              // просмотр из тестовой панели: просто закрываем
  P.homeSkip = true; save();
  setTimeout(() => intro(), 250);
}
function hideHome() { ROOT.classList.remove("homeask"); }
function startIntro() { if (needHome()) showHome(); else intro(); }

// ---------- старт ----------
document.getElementById("boot").classList.add("done");
setTimeout(() => document.getElementById("boot").remove(), 700);
setTimeout(() => {                       // заранее подгружаем картинки игр и карточек, чтобы всё открывалось сразу
  const imgs = ["game25_bg.webp", "game25.webp", "game26.webp", "game27.webp", "game28_bg.webp", "game28_items.webp", "game28_food.webp",
    "game29.webp", "game30.webp", "game31.webp", "game28_cat.webp", "card25.webp", "card26.webp", "card27.webp", "card28.webp", "card29.webp", "card30.webp", "card31.webp", "whisky_talk.png"];
  const jsons = ["game25.json", "game26.json", "game27.json", "game28_items.json", "game28_food.json", "game29.json", "game30.json", "game31.json"];
  window.__pre = imgs.map(f => { const i = new Image(); i.src = "assets/" + f; return i; });
  jsons.forEach(f => fetch("assets/" + f).catch(() => {}));
}, 1200);
// запасная копия сайта в браузере (только на настоящем сайте, не в превью)
if ("serviceWorker" in navigator && window.top === window && (location.protocol === "https:" || location.hostname === "localhost")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  if (document.readyState === "complete") navigator.serviceWorker.register("sw.js").catch(() => {});
}
requestAnimationFrame(() => stage.classList.add("on"));
requestAnimationFrame(draw);
if (!P.intro) startIntro();
else { W.x = rnd(600, 1400); W.y = FLOOR; W.onBed = false; W.asleep = false; setAnim("sit", 2.5); if (!P.calFound) calHintAt = now() + 60000; life(); }
})();
</script>
</body>
</html>
